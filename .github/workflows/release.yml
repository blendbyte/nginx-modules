name: release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'GitHub Actions run ID of the build to publish'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip the upload to production)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Every production release shares one database, regardless of source branch.
concurrency:
  group: apt-repository-production
  cancel-in-progress: false

jobs:
  publish:
    name: publish to apt.blendbyte.net/nginx
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval if configured
    env:
      # GPG key for signing the apt repo. The key id is publishable
      # information; only the private key material itself is sensitive.
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      # Codenames we publish for. Must match what build.yml produces.
      CODENAMES: bookworm trixie jammy noble resolute
      # S3-compatible object storage credentials (follows OpenBao convention).
      AWS_ACCESS_KEY_ID:     ${{ secrets.PKG_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PKG_S3_SECRET }}
      AWS_REGION:            ${{ vars.PKG_S3_REGION }}
      AWS_ENDPOINT_URL:      ${{ secrets.PKG_S3_ENDPOINT_URL }}
      BUCKET:                ${{ secrets.PKG_S3_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate source build
        uses: actions/github-script@v9
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.BUILD_RUN_ID)) {
              throw new Error('build_run_id must be a numeric Actions run ID');
            }
            // Automatic publication is dispatched by the build's final job,
            // which can still be finishing when this release starts.
            for (let attempt = 0; attempt < 24; attempt++) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.BUILD_RUN_ID)
              });
              if (run.path !== '.github/workflows/build.yml' ||
                  run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('Only the build workflow from this repository can be published');
              }
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error('The source build did not succeed');
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('The source build has not completed; retry after it finishes');

      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends reprepro gnupg python3-debian python3-yaml

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./downloaded-artifacts
          pattern: debs-*
          merge-multiple: false

      - name: Consolidate artifacts
        run: |
          mkdir -p ./artifacts
          # download-artifact creates one subdir per artifact name
          # (debs-bookworm-amd64, debs-trixie-arm64, etc.)
          find ./downloaded-artifacts -name '*.deb' -exec mv {} ./artifacts/ \;
          echo "Total .deb files: $(ls ./artifacts/*.deb | wc -l)"
          ls -la ./artifacts/

      - name: Set up GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Avoid interpolating the private key into the generated shell script.
          mkdir -m 700 -p ./gnupg
          umask 077
          printf '%s\n' "$GPG_PRIVATE_KEY" > /tmp/gpg-key.asc
          GNUPGHOME="$PWD/gnupg" gpg --batch --import /tmp/gpg-key.asc 2>&1 | tail -5

      - name: Initialize reprepro tree
        run: |
          mkdir -p ./apt-repo/conf ./apt-repo/db ./apt-repo/dists ./apt-repo/pool
          for codename in $CODENAMES; do
            cat >> ./apt-repo/conf/distributions <<EOF
          Origin: Blendbyte
          Label: Blendbyte nginx-modules
          Codename: $codename
          Suite: $codename
          Architectures: amd64 arm64 source
          Components: main
          Description: Debian dynamic modules for nginx, complementing nginx.org packages
          SignWith: $GPG_KEY_ID

          EOF
          done
          cat > ./apt-repo/conf/options <<EOF
          verbose
          basedir $PWD/apt-repo
          EOF

      - name: Pull existing apt repo state
        run: |
          bash scripts/sync-repo.sh pull ./apt-repo "s3://${BUCKET}"

      - name: Back up restored repository state
        run: |
          tar -czf repo-state-before.tar.gz -C apt-repo db dists

      - name: Retain repository state for recovery
        uses: actions/upload-artifact@v7
        with:
          name: repo-state-before
          path: repo-state-before.tar.gz
          retention-days: 30

      - name: Validate state and merge packages
        run: |
          export GNUPGHOME="$PWD/gnupg"
          /usr/bin/python3 scripts/prepare-release.py ./apt-repo ./artifacts

      - name: Export public keyring
        run: |
          export GNUPGHOME="$PWD/gnupg"
          gpg --export --armor "$GPG_KEY_ID" \
              > ./apt-repo/blendbyte-archive-keyring.gpg.asc
          gpg --export "$GPG_KEY_ID" \
              > ./apt-repo/blendbyte-archive-keyring.gpg

      - name: Write status.txt
        run: |
          debs=( ./artifacts/*.deb )
          nginx_version=$(dpkg-deb -f "${debs[0]}" Version \
            | grep -oP '(?<=\+nginx)[0-9]+\.[0-9]+\.[0-9]+')
          echo "nginx ${nginx_version} / last package update on $(date -u +'%Y-%m-%d')" \
            > ./apt-repo/status.txt

      - name: Show what would be uploaded (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          bash scripts/sync-repo.sh push ./apt-repo "s3://${BUCKET}" --dry-run

      - name: Push apt repo to production
        if: ${{ !inputs.dry_run }}
        run: |
          bash scripts/sync-repo.sh push ./apt-repo "s3://${BUCKET}"

      - name: Cleanup secrets
        if: always()
        run: |
          shred -u /tmp/gpg-key.asc 2>/dev/null || rm -f /tmp/gpg-key.asc
          rm -rf ./gnupg
